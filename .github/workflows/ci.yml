name: ExamLex Windows CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore core tests
        run: dotnet restore tests/ExamLex.Core.Tests/ExamLex.Core.Tests.csproj
      - name: Run core unit tests
        run: dotnet test tests/ExamLex.Core.Tests/ExamLex.Core.Tests.csproj --no-restore -c Release
      - name: Restore WinUI project
        run: dotnet restore src/ExamLex/ExamLex.csproj -p:Platform=x64
      - name: Build WinUI app
        run: dotnet build src/ExamLex/ExamLex.csproj --no-restore -c Release -p:Platform=x64
