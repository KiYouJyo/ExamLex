name: ExamLex Windows CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore core tests
        run: dotnet restore tests/ExamLex.Core.Tests/ExamLex.Core.Tests.csproj
      - name: Run core unit tests
        run: dotnet test tests/ExamLex.Core.Tests/ExamLex.Core.Tests.csproj --no-restore -c Release
      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Install owner-provided icon assets
        shell: pwsh
        run: ./scripts/Install-IconAssets.ps1
      - name: Build WinUI app
        shell: pwsh
        run: |
          msbuild src/ExamLex/ExamLex.csproj /restore /p:Configuration=Release /p:Platform=x64 /verbosity:diagnostic /nologo *> xaml-build.log
          $exit = $LASTEXITCODE
          Get-Content xaml-build.log | Select-String -Pattern 'error|exception|WMC|XamlCompiler|fatal' -Context 3,2 | Select-Object -Last 160
          exit $exit
      - name: Upload unsigned WinUI development build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExamLex-win-x64-dev
          path: src/ExamLex/bin/x64/Release/
          if-no-files-found: error
          retention-days: 14
      - name: Inspect XAML outputs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem src/ExamLex/obj -Recurse -File -Include output.json,*.err,*.log | ForEach-Object {
            Write-Host "==== $($_.FullName) ===="
            Get-Content $_.FullName | Select-Object -Last 140
          }
