name: Signed MSIX acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - scripts/Install-IconAssets.ps1
      - ExamLex_Complete_Icon_Assets_v3.zip
      - packaging/**
      - .github/workflows/msix-acceptance.yml
      - scripts/Stage-LatestLexicon.ps1

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python for SQLite schema validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Test score engine
        shell: pwsh
        run: |
          dotnet test tests/ExamLex.Core.Tests/ExamLex.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Score engine tests failed.' }

      - name: Prepare signing identity
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.EXAMLEX_CERTIFICATE_BASE64 || secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          CERT_PFX_PASSWORD: ${{ secrets.EXAMLEX_CERTIFICATE_PASSWORD || secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PFX_PASSWORD)) {
            throw 'Signing secrets missing: expected GH_RELEASE_CERTIFICATE_BASE64/GH_RELEASE_CERTIFICATE_PASSWORD, or EXAMLEX_CERTIFICATE_BASE64/EXAMLEX_CERTIFICATE_PASSWORD.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'examlex-private.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
            $secure = ConvertTo-SecureString $env:CERT_PFX_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            if (-not $cert -or -not $cert.HasPrivateKey) { throw 'PFX certificate has no usable private key.' }
            [xml]$manifest = Get-Content 'src/ExamLex/Package.appxmanifest' -Raw
            $manifest.Package.Identity.Publisher = $cert.Subject
            $manifest.Save((Join-Path $PWD 'src/ExamLex/Package.appxmanifest'))
            $out = Join-Path $env:RUNNER_TEMP 'ExamLex-v0.2.0-MSIX-acceptance'
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            Export-Certificate -Cert $cert -FilePath (Join-Path $out 'ExamLex_0.2.0_public.cer') | Out-Null
            "EXAMLEX_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "EXAMLEX_PUBLISHER=$($cert.Subject)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "EXAMLEX_OUTPUT=$out" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Signing identity ready. Private key not exported.'
          }
          finally { if (Test-Path $pfx) { Remove-Item $pfx -Force } }

      - name: Install user-provided ExamLex v3 icon assets
        shell: pwsh
        run: ./scripts/Install-IconAssets.ps1

      - name: Stage newest official ExamLex-Lexicon
        shell: pwsh
        run: ./scripts/Stage-LatestLexicon.ps1

      - name: Compile x64 MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgOut = Join-Path $env:RUNNER_TEMP 'ExamLex-msix-out'
          New-Item -ItemType Directory -Force -Path $pkgOut | Out-Null
          msbuild src/ExamLex/ExamLex.csproj /restore /nologo /m /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly "/p:AppxPackageDir=$pkgOut\"
          if ($LASTEXITCODE -ne 0) { throw 'MSIX compilation failed.' }
          $packages = @(Get-ChildItem $pkgOut -Recurse -File -Filter '*.msix')
          if ($packages.Count -ne 1) { throw "Expected one .msix, got $($packages.Count)." }
          Copy-Item $packages[0].FullName (Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0.0_x64.msix') -Force

      - name: Sign and validate MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0.0_x64.msix'
          $sdkBin = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Windows Kits\10\bin'
          $tool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $tool) { throw 'signtool.exe not found.' }
          & $tool.FullName sign /fd SHA256 /sha1 $env:EXAMLEX_THUMBPRINT /tr http://timestamp.digicert.com /td SHA256 $package
          if ($LASTEXITCODE -ne 0) { throw 'MSIX sign failed.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $package
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $env:EXAMLEX_THUMBPRINT -or $signature.Status -in @('NotSigned','HashMismatch','NotSupportedFileFormat')) {
            throw "MSIX signature invalid: $($signature.Status)."
          }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead($package)
          try {
            foreach ($part in @('AppxManifest.xml','AppxBlockMap.xml','AppxSignature.p7x')) {
              if (-not $archive.GetEntry($part)) { throw "Missing MSIX entry: $part" }
            }

            $dbEntry = @($archive.Entries | Where-Object { $_.FullName.Replace('\\','/') -match 'Assets/Lexicon/examlex-lexicon\\.db
            try { [xml]$inside = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($inside.Package.Identity.Name -ne 'KiYouJyo.ExamLex' -or $inside.Package.Identity.Version -ne '0.2.0.0' -or $inside.Package.Identity.Publisher -ne $env:EXAMLEX_PUBLISHER) { throw 'Package identity mismatch.' }
          }
          finally { $archive.Dispose() }
          Copy-Item src/ExamLex/Assets/Square150x150Logo.png (Join-Path $env:EXAMLEX_OUTPUT 'ExamLex-Icon.png') -Force
          Copy-Item packaging/INSTALL.md (Join-Path $env:EXAMLEX_OUTPUT 'INSTALL.md')
          @('ExamLex_0.2.0.0_x64.msix','ExamLex_0.2.0_public.cer') | ForEach-Object {
            $hash = (Get-FileHash (Join-Path $env:EXAMLEX_OUTPUT $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$_"
          } | Set-Content (Join-Path $env:EXAMLEX_OUTPUT 'SHA256SUMS.txt') -Encoding ascii
          Write-Host 'MSIX signed; identity, payload and checksums validated.'

      - name: Install and unregister MSIX smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0_public.cer'
          $package = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0.0_x64.msix'
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          try {
            Add-AppxPackage -Path $package -ErrorAction Stop
            $installed = Get-AppxPackage -Name 'KiYouJyo.ExamLex'
            if (-not $installed -or [string]$installed.Version -ne '0.2.0.0') { throw 'MSIX installation verification failed.' }
            Remove-AppxPackage -Package $installed.PackageFullName
            Write-Host 'MSIX install/registration smoke test passed.'
          }
          finally {
            Get-ChildItem Cert:\LocalMachine\TrustedPeople |
              Where-Object Thumbprint -eq $env:EXAMLEX_THUMBPRINT |
              ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Force }
          }

      - name: Upload signed MSIX acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: ExamLex-v0.2.0-MSIX-acceptance
          path: ${{ env.EXAMLEX_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30
 })
            $manifestEntry = @($archive.Entries | Where-Object { $_.FullName.Replace('\\','/') -match 'Assets/Lexicon/lexicon-manifest\\.json
            try { [xml]$inside = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($inside.Package.Identity.Name -ne 'KiYouJyo.ExamLex' -or $inside.Package.Identity.Version -ne '0.2.0.0' -or $inside.Package.Identity.Publisher -ne $env:EXAMLEX_PUBLISHER) { throw 'Package identity mismatch.' }
          }
          finally { $archive.Dispose() }
          Copy-Item packaging/INSTALL.md (Join-Path $env:EXAMLEX_OUTPUT 'INSTALL.md')
          @('ExamLex_0.2.0.0_x64.msix','ExamLex_0.2.0_public.cer') | ForEach-Object {
            $hash = (Get-FileHash (Join-Path $env:EXAMLEX_OUTPUT $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$_"
          } | Set-Content (Join-Path $env:EXAMLEX_OUTPUT 'SHA256SUMS.txt') -Encoding ascii
          Write-Host 'MSIX signed; identity, payload and checksums validated.'

      - name: Install and unregister MSIX smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0_public.cer'
          $package = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0.0_x64.msix'
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          try {
            Add-AppxPackage -Path $package -ErrorAction Stop
            $installed = Get-AppxPackage -Name 'KiYouJyo.ExamLex'
            if (-not $installed -or [string]$installed.Version -ne '0.2.0.0') { throw 'MSIX installation verification failed.' }
            Remove-AppxPackage -Package $installed.PackageFullName
            Write-Host 'MSIX install/registration smoke test passed.'
          }
          finally {
            Get-ChildItem Cert:\LocalMachine\TrustedPeople |
              Where-Object Thumbprint -eq $env:EXAMLEX_THUMBPRINT |
              ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Force }
          }

      - name: Upload signed MSIX acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: ExamLex-v0.2.0-MSIX-acceptance
          path: ${{ env.EXAMLEX_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30
 })
            if ($dbEntry.Count -ne 1 -or $manifestEntry.Count -ne 1) { throw 'Bundled Lexicon SQLite or manifest is missing from signed MSIX.' }
            if ($dbEntry[0].Length -lt 1024) { throw 'Bundled lexicon appears empty.' }
            $reader = [IO.StreamReader]::new($archive.GetEntry('AppxManifest.xml').Open())
            try { [xml]$inside = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($inside.Package.Identity.Name -ne 'KiYouJyo.ExamLex' -or $inside.Package.Identity.Version -ne '0.2.0.0' -or $inside.Package.Identity.Publisher -ne $env:EXAMLEX_PUBLISHER) { throw 'Package identity mismatch.' }
          }
          finally { $archive.Dispose() }
          Copy-Item packaging/INSTALL.md (Join-Path $env:EXAMLEX_OUTPUT 'INSTALL.md')
          @('ExamLex_0.2.0.0_x64.msix','ExamLex_0.2.0_public.cer') | ForEach-Object {
            $hash = (Get-FileHash (Join-Path $env:EXAMLEX_OUTPUT $_) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$_"
          } | Set-Content (Join-Path $env:EXAMLEX_OUTPUT 'SHA256SUMS.txt') -Encoding ascii
          Write-Host 'MSIX signed; identity, payload and checksums validated.'

      - name: Install and unregister MSIX smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0_public.cer'
          $package = Join-Path $env:EXAMLEX_OUTPUT 'ExamLex_0.2.0.0_x64.msix'
          Import-Certificate -FilePath $cert -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          try {
            Add-AppxPackage -Path $package -ErrorAction Stop
            $installed = Get-AppxPackage -Name 'KiYouJyo.ExamLex'
            if (-not $installed -or [string]$installed.Version -ne '0.2.0.0') { throw 'MSIX installation verification failed.' }
            Remove-AppxPackage -Package $installed.PackageFullName
            Write-Host 'MSIX install/registration smoke test passed.'
          }
          finally {
            Get-ChildItem Cert:\LocalMachine\TrustedPeople |
              Where-Object Thumbprint -eq $env:EXAMLEX_THUMBPRINT |
              ForEach-Object { Remove-Item -LiteralPath $_.PSPath -Force }
          }

      - name: Upload signed MSIX acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: ExamLex-v0.2.0-MSIX-acceptance
          path: ${{ env.EXAMLEX_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30
